<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#fff8ee" />
<title>Sudhaar · Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff8ee; color: #2b1d14; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }
  main { max-width: 22rem; margin: 1rem; padding: 1.5rem; text-align: center; background: #fff; border: 1px solid #ecdcc6; border-radius: 1.25rem; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.3rem; margin: .75rem 0 .25rem; }
  p { color: #7a6553; font-size: .95rem; line-height: 1.45; margin: .4rem 0; }
  button { margin-top: 1rem; border: 0; border-radius: .9rem; padding: .7rem 1.4rem; font-size: 1rem; font-weight: 600; color: #fff; background: #d9572b; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="Sudhaar" />
  <h1>You're offline</h1>
  <p>Your repair is safe. PayPal keeps holding the money until your item is delivered with the OTP.</p>
  <p lang="hi">आप ऑफ़लाइन हैं। आपकी रिपेयर सुरक्षित है, और डिलीवरी OTP तक पैसा PayPal के पास होल्ड रहता है।</p>
  <button onclick="location.reload()">Try again · फिर कोशिश करें</button>
</main>
